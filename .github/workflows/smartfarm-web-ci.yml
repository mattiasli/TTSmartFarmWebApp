name: smartfarm-web-ci

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LIVE_COMMANDS_ENABLED: 'false'
  LIVE_PUMP_ENABLED: 'false'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:contracts
      - run: npm run check:frontend-imports
      - run: npm run test:unit -- --reporter=default --reporter=junit --outputFile=test-results/unit.xml
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ !cancelled() }}
        with:
          name: unit-results-${{ github.sha }}
          path: test-results/unit.xml
          retention-days: 7
          if-no-files-found: warn

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartfarm
          POSTGRES_PASSWORD: smartfarm
          POSTGRES_DB: smartfarm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartfarm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://smartfarm:smartfarm@127.0.0.1:5432/smartfarm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:integration -- --reporter=default --reporter=junit --outputFile=test-results/integration.xml
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ !cancelled() }}
        with:
          name: integration-results-${{ github.sha }}
          path: test-results/integration.xml
          retention-days: 7
          if-no-files-found: warn

  federation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:federation
      - run: npm run check:client-secrets
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ !cancelled() }}
        with:
          name: federation-results-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/scripts/run-e2e-test.mjs
      # Only isolated simulator fixtures are exercised; never upload hosted sessions.
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ !cancelled() }}
        with:
          name: e2e-results-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn

  required:
    name: smartfarm-required
    if: ${{ always() }}
    needs: [checks, integration, federation, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every prerequisite to succeed
        env:
          CHECKS: ${{ needs.checks.result }}
          INTEGRATION: ${{ needs.integration.result }}
          FEDERATION: ${{ needs.federation.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          for result in "$CHECKS" "$INTEGRATION" "$FEDERATION" "$E2E"; do
            if [ "$result" != success ]; then
              echo "A required CI job failed, was skipped, or was cancelled."
              exit 1
            fi
          done
