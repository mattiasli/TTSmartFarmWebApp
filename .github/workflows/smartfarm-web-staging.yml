name: smartfarm-web-staging

on:
  workflow_run:
    workflows: [smartfarm-web-ci]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character default-branch SHA with successful CI
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: smartfarm-staging-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      vars.STAGING_RELEASE_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-latest
    environment: smartfarm-staging
    timeout-minutes: 60
    steps:
      # Validate with trusted default-branch tooling before checking out the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Verify exact source and all CI prerequisites
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: node tools/scripts/verify-staging-release-source.mjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - run: npm ci
      - run: npm install --global @railway/cli@5.58.0 vercel@59.23.2
      - run: npx playwright install --with-deps chromium
      - name: Deploy and qualify API, remote, then host
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_CI_URL: ${{ steps.source.outputs.ci_url }}
          STAGING_RELEASE_ENABLED: ${{ vars.STAGING_RELEASE_ENABLED }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VERCEL_HOST_TOKEN: ${{ secrets.VERCEL_HOST_TOKEN }}
          VERCEL_REMOTE_TOKEN: ${{ secrets.VERCEL_REMOTE_TOKEN }}
          STAGING_SESSION_COOKIE: ${{ secrets.STAGING_SESSION_COOKIE }}
          VERCEL_HOST_AUTOMATION_BYPASS: ${{ secrets.VERCEL_HOST_AUTOMATION_BYPASS }}
        run: node tools/scripts/release-staging.mjs
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: ${{ always() }}
        with:
          name: staging-release-${{ steps.source.outputs.sha || github.run_id }}
          path: test-results/staging-release.json
          retention-days: 30
          if-no-files-found: warn
