services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: smartfarm
      POSTGRES_PASSWORD: smartfarm
      POSTGRES_DB: smartfarm
    ports:
      - "5432:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartfarm"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./tools/broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
